name: RoyalVotes
version: ${version}
main: com.mystipixel.royalvotes.RoyalVotesPlugin
api-version: '26.2'
author: Mystipixel
description: Receives Votifier votes itself and pays vote rewards, streaks, milestones and vote parties.
# RoyalVotes is the vote receiver, so plugins that depend on "Votifier" are satisfied by it. It cannot
# run alongside Votifier/NuVotifier — it replaces them.
provides: [Votifier]
# Placeholders in reward text resolve through PlaceholderAPI when it is installed. eco is listed only
# for ordering, so the libreforge vote trigger is switched on as early as possible.
softdepend: [PlaceholderAPI, eco]
commands:
  vote:
    description: Show the vote links.
    usage: /vote
  votetop:
    description: Show the players with the most votes.
    usage: /votetop [page]
  royalvotes:
    description: RoyalVotes admin tools.
    usage: /royalvotes <reload|status|fakevote|stats|party>
    aliases: [rv]
    permission: royalvotes.admin
permissions:
  royalvotes.admin:
    description: Reload, inspect and test RoyalVotes.
    default: op
